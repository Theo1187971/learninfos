<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Learner</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; padding: 20px; max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #333; }
        .card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
        .card:hover { box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
        .year { color: #007aff; font-weight: bold; font-size: 0.9em; }
        .content { margin-top: 5px; line-height: 1.5; }
        .notif-btn { background: #007aff; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1em; cursor: pointer; display: block; margin: 20px auto; }
        .notif-btn:hover { background: #0051d5; }
        .notif-btn:disabled { background: #ccc; cursor: not-allowed; }
        .notif-status { text-align: center; color: #666; font-size: 0.9em; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Savoirs du jour</h1>
    <div class="notif-status" id="notif-status"></div>
    <button class="notif-btn" id="notif-btn">🔔 Activer les notifications</button>
    
    <!-- Debug Console -->
    <div style="background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin: 20px 0; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.85em; word-wrap: break-word; user-select: text;">
        <strong>📋 Debug Logs:</strong>
        <div id="debug-console" style="word-wrap: break-word; overflow-wrap: break-word;"></div>
    </div>
    
    <div id="app">Chargement...</div>

<script type="module">
        import { messaging } from './firebase.js';
        import { getToken } from 'https://www.gstatic.com/firebasejs/12.8.0/firebase-messaging.js';

        // Debug logger
        const debugConsole = document.getElementById('debug-console');
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'black';
            debugConsole.innerHTML += `<div style="color: ${color}; margin: 5px 0;">[${timestamp}] ${message}</div>`;
            debugConsole.scrollTop = debugConsole.scrollHeight;
            console.log(message);
        }

        log('🚀 App démarrée');
        log(`📱 User Agent: ${navigator.userAgent.substring(0, 50)}...`);
        log(`🔔 Notifications supportées: ${'Notification' in window}`);
        log(`⚙️ Service Worker supporté: ${'serviceWorker' in navigator}`);

        // Load articles
        fetch('data.json?v=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                const app = document.getElementById('app');
                
                if(data.length === 0) {
                    app.innerHTML = "Aucune actualité trouvée pour le moment.";
                    return;
                }

                app.innerHTML = data.map(item => `
                    <div class="card" onclick="window.open('${item.url}', '_blank')">
                        <div class="year" style="color: #d93025; text-transform: uppercase; font-size: 0.8em;">${item.source}</div>
                        <h3 style="margin: 5px 0; font-size: 1.1em;">${item.titre}</h3>
                        <div class="content" style="color: #555; font-size: 0.9em;">${item.description}</div>
                    </div>
                `).join('');
                log(`✅ ${data.length} articles chargés`, 'success');
            })
            .catch(err => {
                document.getElementById('app').innerHTML = "Chargement...";
                log(`❌ Erreur chargement articles: ${err.message}`, 'error');
            });

        // Register service worker
        if ('serviceWorker' in navigator) {
            log('📝 Tentative d\'enregistrement du Service Worker...');
            navigator.serviceWorker.register('./firebase-messaging-sw.js')
                .then(registration => {
                    log('✅ Service Worker enregistré avec succès!', 'success');
                    log(`Scope: ${registration.scope}`);
                })
                .catch(err => {
                    log(`❌ Erreur Service Worker: ${err.message}`, 'error');
                    log(`Détails: ${err.toString()}`, 'error');
                });
        } else {
            log('❌ Service Worker non supporté sur ce navigateur', 'error');
        }

        // Notification button logic
        const notifBtn = document.getElementById('notif-btn');
        const notifStatus = document.getElementById('notif-status');

        // Check if already subscribed
        const savedToken = localStorage.getItem('fcm_token');
        if (savedToken) {
            notifStatus.textContent = '✅ Notifications activées';
            notifBtn.textContent = '✓ Notifications activées';
            notifBtn.disabled = true;
            log('ℹ️ Token FCM déjà sauvegardé');
        }

        notifBtn.addEventListener('click', async () => {
            try {
                log('🔔 Demande de permission...');
                const permission = await Notification.requestPermission();
                log(`Permission: ${permission}`);
                
                if (permission === 'granted') {
                    log('✅ Permission accordée!', 'success');
                    log('⏳ Attente du Service Worker...');
                    
                    // Wait for service worker to be ready
                    const registration = await navigator.serviceWorker.ready;
                    log('✅ Service Worker prêt!', 'success');
                    log('🔑 Récupération du token FCM...');
                    
                    const token = await getToken(messaging, {
                        vapidKey: 'BIlM__VS2_0r7pQ0LFAe-DtaGxu2Z9b4qKPkkNlcD2Mdz9kguViarWtZB3M6KsOkjHlKlJkaSGZSIJ1yoncrd6g',
                        serviceWorkerRegistration: registration
                    });
                    
                    localStorage.setItem('fcm_token', token);
                    log(`✅ Token FCM obtenu!`, 'success');
                    
                    // Save token to Firebase Database
                    log('💾 Sauvegarde du token dans Firebase...');
                    try {
                        const { database } = await import('./firebase.js');
                        const { ref, set } = await import('https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js');
                        
                        // Generate a unique user ID (or use existing one)
                        let userId = localStorage.getItem('user_id');
                        if (!userId) {
                            userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                            localStorage.setItem('user_id', userId);
                        }
                        
                        await set(ref(database, 'fcm_tokens/' + userId), {
                            token: token,
                            timestamp: Date.now(),
                            userAgent: navigator.userAgent.substring(0, 100)
                        });
                        
                        log('✅ Token sauvegardé dans Firebase!', 'success');
                        log(`📋 User ID: ${userId}`);
                    } catch (error) {
                        log(`⚠️ Erreur sauvegarde Firebase: ${error.message}`, 'error');
                        log('Le token est quand même sauvegardé localement');
                    }
                    
                    log(`📋 TOKEN COMPLET:`, 'info');
                    log(`${token}`, 'success');
                    
                    notifStatus.textContent = '✅ Notifications activées et sauvegardées !';
                    notifBtn.textContent = '✓ Notifications activées';
                    notifBtn.disabled = true;
                } else {
                    log('❌ Permission refusée', 'error');
                    notifStatus.textContent = '❌ Permission refusée';
                }
            } catch (error) {
                log(`❌ ERREUR: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
                notifStatus.textContent = '❌ Erreur: ' + error.message;
            }
        });
    </script>
</body>
</html>
